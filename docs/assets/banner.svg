    <path d="M106 68V219M73 76C56 97 92 103 85 123C78 143 49 129 44 151M148 77C168 97 129 104 138 125C147 142 170 131 174 156M47 176C70 161 90 180 78 204M164 179C144 164 125 180 138 207M104 145C86 153 91 169 104 177M111 96C125 103 119 114 110 121" fill="none" stroke="#8bddd5" stroke-width="2" stroke-linecap="round" opacity=".75"/>
    <text x="106" y="305" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" fill="#90bdce" font-size="13" letter-spacing="2">NATIVE T1w GRID</text>
