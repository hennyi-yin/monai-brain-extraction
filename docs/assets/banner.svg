<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="350" viewBox="0 0 1400 350" role="img" aria-labelledby="title desc">
  <title id="title">MONAI Brain Extraction</title>
  <desc id="desc">A reproducible three-dimensional MRI segmentation benchmark on NFBS.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d37"/><stop offset="1" stop-color="#153c4b"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#55e6c1"/><stop offset="1" stop-color="#6aa9ff"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#77afbf" stroke-opacity=".09"/></pattern>
  </defs>
  <rect width="1400" height="350" rx="20" fill="url(#bg)"/>
  <rect width="1400" height="350" rx="20" fill="url(#grid)"/>
  <circle cx="1220" cy="60" r="200" fill="#61d5bf" opacity=".045"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="65" y="73" fill="#69e1cc" font-size="15" font-weight="700" letter-spacing="3">NEUROIMAGING · OPEN RESEARCH</text>
    <text x="65" y="142" fill="#f3f8ff" font-size="52" font-weight="700">MONAI Brain Extraction</text>
    <text x="67" y="188" fill="#b8ccde" font-size="23">3D U-Net segmentation. Native-grid evaluation. Reproducible evidence.</text>
    <g transform="translate(65 230)">
      <rect width="205" height="63" rx="10" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="16" y="27" fill="#fff" font-size="22" font-weight="700">125 MRI scans</text>
      <text x="16" y="48" fill="#a9c5d8" font-size="13">NFBS · 85 / 15 / 25 split</text>
      <rect x="224" width="205" height="63" rx="10" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="240" y="27" fill="#fff" font-size="22" font-weight="700">0.9863 Dice</text>
      <text x="240" y="48" fill="#a9c5d8" font-size="13">U-Net · 25 held-out subjects</text>
      <rect x="448" width="205" height="63" rx="10" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="464" y="27" fill="#fff" font-size="22" font-weight="700">Frozen protocol</text>
      <text x="464" y="48" fill="#a9c5d8" font-size="13">SHA-256 · commands · checks</text>
    </g>
  </g>
  <g transform="translate(1045 45)">
