    <rect x="-20" y="16" width="220" height="245" rx="24" fill="none" stroke="#9bc2dd" stroke-opacity=".25"/>
    <rect x="-5" y="30" width="220" height="245" rx="24" fill="#162e44" stroke="#81cbd1" stroke-opacity=".5"/>
